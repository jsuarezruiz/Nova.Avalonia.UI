name: Deploy documentation and gallery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.100

      - name: Install DocFX
        run: dotnet tool update -g docfx

      - name: Build documentation
        working-directory: docs
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          docfx docfx.json --warningsAsErrors

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish browser gallery
        run: dotnet publish src/Nova.Avalonia.UI.Gallery.Browser/Nova.Avalonia.UI.Gallery.Browser.csproj --configuration Release --verbosity minimal

      - name: Add gallery to documentation site
        run: |
          mkdir -p docs/_site/gallery
          cp -R src/Nova.Avalonia.UI.Gallery.Browser/bin/Release/net10.0-browser/publish/wwwroot/. docs/_site/gallery/
          touch docs/_site/.nojekyll

      - name: Upload documentation and gallery
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
