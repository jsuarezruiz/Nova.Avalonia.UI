<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Explore Nova.Avalonia.UI controls and samples in your browser.">
    <title>Nova.Avalonia.UI Gallery</title>
    <link rel="icon" type="image/png" href="./nova-logo.png">
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <main id="out">
        <div class="avalonia-splash" role="status" aria-live="polite" aria-label="Loading Nova.Avalonia.UI Gallery">
            <div class="splash-glow splash-glow-top" aria-hidden="true"></div>
            <div class="splash-glow splash-glow-bottom" aria-hidden="true"></div>

            <div class="splash-content">
                <div class="splash-mark" aria-hidden="true">
                    <img src="./nova-logo.png" alt="">
                </div>

                <div class="splash-copy">
                    <div class="splash-title"><strong>Nova</strong><span>.Avalonia.UI</span></div>
                    <p>Controls and layouts for Avalonia</p>
                </div>

                <div class="splash-loading" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span class="splash-label">Loading gallery</span>
            </div>

            <span class="splash-footer">WebAssembly Gallery</span>
        </div>
    </main>
    <noscript>This gallery needs JavaScript and WebAssembly enabled.</noscript>
    <script type="module" src="./main.js"></script>
</body>
</html>
